<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/tarjeta_clientes.css">

    <title>Tarjeta cliente</title>
</head>
<body>

 <article class="tarjeta_parte_1">
<img src="../img/clientes/Leonardo.jpg" alt="Foto de Leonardo Masias">
<h2 class="nombre_cliente">Leonardo Masias</h2>
<p class="info_cliente">Eco Warrior . Miembro Desde 2022</p>
</article>

<artcule class="tarjeta_parte_2">
<h2 class="number_1">Arboles Plantados</h2>
    <h3>grupo filtro</h3>
        <input type="range" min="0" max="20" value="12" aria-label="">
            <div class="rango_arboles">
                <span>12</span>
                <span>/</span>
                <span>20</span>
                </div>
            </div>

    <h3>Agua Ahorrada</h3>
        <input type="range" min="0" max="450" value="300" aria-label="">
            <div class="rango_agua">
                <span>300 L</span>
                <span>/</span>
                <span>450 L</span>
                </div>
            </div>

    <h3>Eco-Points</h3>
        <input type="range" min="0" max="9999999999" value="300" aria-label="">
            <div class="rango_agua">
                <span>300 points</span>
                <span>/</span>
                <span>9999999999 points</span>
                </div>
            </div>
            
</body>
</html>
